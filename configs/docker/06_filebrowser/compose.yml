name: "filebrowser"

networks:
  # filebrowser_net:
  #   external: false
  net:
    name: "webapps"
    external: true

services:

  filebrowser:
    container_name: "filebrowser"
    networks:
    - "net"
    image: "filebrowser/filebrowser"
    volumes:
    - "/mnt/file_browser_root:/srv"
    - "/srv/docker_data/filebrowser/filebrowser.db:/database.db"
    user: "1000:1000"
    # ports:
    # - "80:80"
    restart: "unless-stopped"
